<nav class="filters" aria-label="Filter posts by category">

  <a href="#fitness" data-filter="fitness">fitness <span class="count">1</span></a>
  <a href="#life" data-filter="life">life <span class="count">1</span></a>
</nav>

<ul class="post-list">
  <li data-category="fitness">
    <time datetime="2025-12-06T00:00:00-08:00">Dec 6, 2025</time>

  </li>
</ul>

<p class="empty" hidden>No posts in this category yet.</p>

<script>
  // Category filter: /blog/#climbing shows only posts in "climbing".
  (function () {
    var links = document.querySelectorAll('.filters a');
    var items = document.querySelectorAll('.post-list li');
    var empty = document.querySelector('.empty');
    function apply() {
      var want = decodeURIComponent(location.hash.slice(1)) || 'all';
      var shown = 0;
      items.forEach(function (li) {
        var show = want === 'all' || li.dataset.category === want;
        li.hidden = !show;
        if (show) shown++;
      });
      links.forEach(function (a) {
        a.classList.toggle('active', a.dataset.filter === want);
      });
      empty.hidden = shown > 0;
    }
    window.addEventListener('hashchange', apply);
    apply();
  })();
</script>
